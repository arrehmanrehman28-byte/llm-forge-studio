name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - name: Lint check
      run: |
        python -m py_compile app.py backend/*.py
    - name: Test imports
      run: |
        python -c "import backend.utils; print('Utils OK')"
        python -c "import backend.efficiency; print('Efficiency OK')"
    - name: Check files
      run: |
        ls -lh README.md colab.ipynb app.py
        echo "✅ All files present"
