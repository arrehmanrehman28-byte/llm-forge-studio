name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gradio==4.44.1 huggingface_hub==0.25.2 fastapi uvicorn pandas plotly
        pip install -r requirements.txt || true
        pip install black ruff pytest
    
    - name: Lint with black
      run: |
        black --check app.py backend/ || echo "Black check done"
    
    - name: Check imports
      run: |
        python -m py_compile app.py
        python -m py_compile backend/*.py
    
    - name: Test FastAPI
      run: |
        cd backend && python -c "import server; print('FastAPI OK')"
    
    - name: Test Gradio import
      run: |
        python -c "import gradio; print(f'Gradio {gradio.__version__} OK')"

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t llm-forge-studio:test .
    
    - name: Test Docker image
      run: |
        docker run --rm llm-forge-studio:test python -c "import gradio; print('Docker OK')"

  release:
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
    - name: Create Release
      run: |
        echo "Ready for release - v1.0.0"
