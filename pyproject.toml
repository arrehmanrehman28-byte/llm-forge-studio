[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-forge-studio"
version = "1.0.0"
description = "No-Code, Python-Friendly, Highly Efficient LLM Factory - Maker, Trainer, Tuner, Tester, Exporter + From Scratch"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "LLM Forge Studio", email = "hello@llm-forge.dev"}
]
keywords = ["llm", "ai", "machine-learning", "no-code", "fine-tuning", "qlora", "transformers", "gradio", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gradio==4.44.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "torch",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "accelerate>=0.27.0",
    "datasets>=2.18.0",
    "optuna>=3.5.0",
    "plotly>=5.20.0",
    "pandas>=2.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub==0.25.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/yourusername/llm-forge-studio"
Repository = "https://github.com/yourusername/llm-forge-studio"
Issues = "https://github.com/yourusername/llm-forge-studio/issues"
Documentation = "https://github.com/yourusername/llm-forge-studio#readme"

[project.scripts]
llm-forge = "app:main"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
